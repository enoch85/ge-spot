version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "GitHub Actions"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # These three are pinned against each other upstream and must be bumped
    # together, otherwise the pip resolver rejects the update.
    groups:
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
          - "aiohttp"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "Python"
