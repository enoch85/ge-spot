version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Let fresh releases age before adopting them, so a hijacked or yanked
    # release is caught upstream first. Security updates skip the cooldown.
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github_actions"
    commit-message:
      prefix: "GitHub Actions"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    # pytest-homeassistant-custom-component pins an exact homeassistant
    # release, so bumping either one alone fails to resolve.
    groups:
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "Python"
