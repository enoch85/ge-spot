name: Sync manifest requirements

on:
  push:
    branches:
      - main
    paths:
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync Home Assistant manifest requirements
        run: python scripts/sync_manifest_requirements.py

      - name: Commit manifest updates
        run: |
          if git diff --quiet -- custom_components/ge_spot/manifest.json; then
            echo "manifest.json already matches requirements.txt"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/ge_spot/manifest.json
          git commit -m "Sync manifest requirements"
          git push
